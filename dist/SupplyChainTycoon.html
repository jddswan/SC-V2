nt sanitaire obligatoire avant la vente."},ZA:{name:"Afrique du Sud",city:"Johannesburg",flag:"🇿🇦",unlockCost:18e4,size:.6,price:1.1,posCost:35e3,defaultMode:"sea",mix:{PARFUM:1.3,SKINCARE:.9,MAKEUP:1,PRESTIGE:.7},modes:{sea:{time:1520,cost:250,co2:45},air:{time:384,cost:1400,co2:1700}},blurb:"La porte d'entrée de l'Afrique australe. Les conteneurs arrivent à Durban puis montent en camion jusqu'à Johannesburg."},KR:{name:"Corée du Sud",city:"Séoul",flag:"🇰🇷",unlockCost:25e4,size:1,price:1.25,posCost:5e4,defaultMode:"air",mix:{PARFUM:.6,SKINCARE:1.8,MAKEUP:1.2,PRESTIGE:.9},modes:{sea:{time:1680,cost:280,co2:50},air:{time:432,cost:1600,co2:2e3}},blurb:"Le pays de la K-beauty : des clientes très expertes en soin, qui suivent les nouveautés de près."},JP:{name:"Japon",city:"Tokyo",flag:"🇯🇵",unlockCost:32e4,size:1.4,price:1.3,posCost:6e4,defaultMode:"air",mix:{PARFUM:.5,SKINCARE:1.7,MAKEUP:1.1,PRESTIGE:1},modes:{sea:{time:1760,cost:290,co2:55},air:{time:432,cost:1700,co2:2100}},blurb:"Le marché le plus exigeant sur la qualité : un étui abîmé ou une étiquette de travers et le carton est refusé."},SG:{name:"Singapour",city:"Singapour",flag:"🇸🇬",unlockCost:2e5,size:.7,price:1.15,posCost:4e4,defaultMode:"air",mix:{PARFUM:1.3,SKINCARE:1.2,MAKEUP:.9,PRESTIGE:1.4},modes:{sea:{time:1360,cost:250,co2:40},air:{time:384,cost:1400,co2:1700}},blurb:"Hub de l'Asie du Sud-Est et grand aéroport de travel retail. Un relais pour toute la région."},AU:{name:"Australie",city:"Sydney",flag:"🇦🇺",unlockCost:28e4,size:.8,price:1.25,posCost:45e3,defaultMode:"air",mix:{PARFUM:1.1,SKINCARE:1.2,MAKEUP:1,PRESTIGE:.8},modes:{sea:{time:2080,cost:320,co2:60},air:{time:480,cost:1800,co2:2300}},blurb:"Au bout du monde : le trajet le plus long du réseau, et des saisons inversées (Noël tombe en plein été)."}},pi={road:"🚚 Route",sea:"🚢 Maritime",air:"✈️ Aérien"},Fx={PARF_50:2,PARF_100:.8,SKIN_CREME:1.4,SKIN_SERUM:1,MK_FOND:1,MK_ROUGE:1.6,PRES_EXTRAIT:.25,PRES_100:.15,PARF_BOISE:1,PARF_FLORAL:1,PARF_EDT:1.1,PARF_FRAIS:1,SKIN_HYDRA:1.2,SKIN_REPAR:.4,SKIN_EXFO:.8,MK_ENCRE:1.2,MK_MASCARA:1.3,MK_HALO:.9,PRES_AMBRE:.15},$m=60,Fm=.01,Z6=.995,Wa={VIRAL:{icon:"📱",title:"Produit viral sur les réseaux",duration:240,lead:0},FESTIVE:{icon:"🎄",title:"Pic des fêtes de fin d'année",duration:500,lead:150},PORT:{icon:"⚓",title:"Grève portuaire",duration:400,lead:0},GLASS:{icon:"🍾",title:"Pénurie de verre",duration:400,lead:0},TRAFFIC:{icon:"🛫",title:"Chute du trafic aérien",duration:400,lead:0},OUTAGE:{icon:"💻",title:"Panne du système informatique",duration:150,lead:0},THEFT:{icon:"🚨",title:"Camion braqué",duration:1,lead:0}},Ra={1:"L'atelier",2:"La centrale",3:"L'essor",4:"Le grand large",5:"Le tour du monde"},La={exp:["🚛","Expédition usine","Envoyez les palettes produites vers la centrale logistique."],centrale:["🏢","Centrale logistique","Le nouvel onglet où arrivent les camions de l'usine."],globe:["🌐","Globe des transports","Suivez en direct vos camions, bateaux et avions sur un globe 3D, avec les sites placés sur la carte."],recv:["📥","Poste Réception","Vos équipiers déchargent et contrôlent les camions à quai."],putaway:["🏗","Poste Rangement","Les palettes contrôlées sont rangées dans les racks."],appro:["📦","Achats & appro usine","Vos stocks de départ baissent : commandez matières et composants."],fil_FR:["🇫🇷","Filiale France","Votre premier client interne : elle vend en France et vous commande."],pick:["🧺","Poste Préparation","Les cartons des commandes filiales sont prélevés dans les racks."],load:["🚛","Poste Chargement","Les commandes préparées partent en camion vers les filiales."],techs:["🔧","Techniciens de maintenance","Ils réparent plus vite et font la maintenance préventive."],navette:["🔁","Navette automatique","Le camion usine → centrale part tout seul dès qu'il est assez rempli."],dashboard:["📊","Tableau de bord","Vos indicateurs clés : CA, résultat, OTIF, taux de service."],kaizen:["🔁","Amélioration continue","Des chantiers terrain qui augmentent durablement le débit de chaque poste."],buyers:["🛒","Acheteurs","Ils passent les commandes fournisseurs à votre place."],marketing:["📢","Marketing","Désirabilité de vos produits, budget publicité et campagnes ciblées : la demande grimpe… à anticiper."],dc_upgrades:["⚙️","Équipements de la centrale","Scanners, chariots, pick-to-light, WMS."],fil_DE:["🇩🇪","Filiale Allemagne","Un deuxième marché européen à ouvrir."],launch:["🧪","Développement","Votre centre de recherche crée de nouvelles références, une par une : plus de ventes, mais plus d'OF et de changements de série à gérer."],sop:["🧭","Module S&OP","Les OF se créent seuls à partir de la demande prévue des filiales et du stock du réseau."],aps:["🤖","Planification automatique","Les OF s'enchaînent seuls à l'usine."],contract:["📝","Contrat d'appro","Un fournisseur vous livre tout un kit à intervalle régulier."],factory_SKINCARE:["🧴","Usine Skincare","Une deuxième catégorie : crème et sérum."],fil_US:["🇺🇸","Filiale États-Unis","Le grand export : bateau ou avion ?"],events:["⚡","Aléas du monde réel","Pannes informatiques, camions braqués, grèves, pénuries, buzz : la supply chain doit encaisser."],factory_MAKEUP:["💄","Usine Maquillage","Fond de teint et rouge à lèvres."],fil_AE:["🇦🇪","Travel Retail Dubaï","Les boutiques duty free, reines du parfum."],fil_CN:["🇨🇳","Filiale Chine","Le premier marché de croissance du luxe."],fil_ES:["🇪🇸","Filiale Espagne","Un pays de parfum, livré en camion."],fil_UK:["🇬🇧","Filiale Royaume-Uni","Le tunnel sous la Manche et la douane du Brexit."],fil_IT:["🇮🇹","Filiale Italie","Par le tunnel du Mont-Blanc."],fil_BR:["🇧🇷","Filiale Brésil","Un géant du parfum, de l'autre côté de l'Atlantique."],fil_KR:["🇰🇷","Filiale Corée du Sud","Le pays de la K-beauty."],fil_JP:["🇯🇵","Filiale Japon","Le marché le plus exigeant sur la qualité."],fil_SG:["🇸🇬","Filiale Singapour","Le hub de l'Asie du Sud-Est."],fil_ZA:["🇿🇦","Filiale Afrique du Sud","La porte de l'Afrique australe."],fil_AU:["🇦🇺","Filiale Australie","Le bout du monde."],factory_PRESTIGE:["💎","Usine Parfums d'exception","Extraits et éditions rares, en petites séries, vendus très cher."]},Tt=[{id:"first_of",chapter:1,title:"Votre premier ordre de fabrication",goal:`Un OF de ${B.PARF_50.name} est déjà au planning. Lancez ses 4 étapes une par une : kit d'appro, pesée, cuve, puis ligne.`,progress:e=>[e.stats.ofDone,1],check:e=>e.stats.ofDone>=1,reward:1e4,unlocks:["exp"],lesson:["L'ordre de fabrication (OF)","Dans une usine cosmétique, rien ne se fabrique sans OF. Il fixe la référence et la quantité, puis déclenche une chaîne : le magasin prépare le kit de matières et de composants, on pèse les matières premières, on fabrique le « vrac » (le jus du parfum) en cuve, et la ligne de conditionnement remplit, bouche et met en étui. Changer de référence sur une ligne impose un nettoyage et des réglages : c'est pourquoi on regroupe les OF d'une même référence."]},{id:"first_truck",chapter:1,title:"Premier départ usine",goal:"Dans Usine › Expédition, envoyez un camion de palettes vers la centrale logistique.",progress:e=>[e.stats.trucksSent,1],check:e=>e.stats.trucksSent>=1,reward:5e3,unlocks:["centrale","recv","globe"],lesson:["Le transport primaire","Le trajet usine → entrepôt central s'appelle le transport primaire. Un semi-remorque européen porte 33 palettes et coûte presque le même prix plein ou à moitié vide : le taux de remplissage des camions est un indicateur suivi de près. Attendre d'avoir un camion bien rempli fait baisser le coût par palette, mais retarde l'arrivée du stock."]},{id:"first_recv",chapter:2,title:"La réception",goal:"Votre camion arrive à la centrale. Vos équipiers du poste Réception vont le décharger : attendez qu'il soit vidé.",progress:e=>[e.stats.trucksReceived,1],check:e=>e.stats.trucksReceived>=1,reward:8e3,unlocks:["putaway","appro"],lesson:["Réceptionner, ce n'est pas juste décharger","À quai, on décharge, on compte et on contrôle : le nombre de palettes doit correspondre à l'avis d'expédition (ASN) envoyé par l'usine, et chaque palette porte une étiquette SSCC qu'on scanne. Tant que ce contrôle n'est pas fait, le stock n'existe pas dans le système. Un camion qui attend trop longtemps dans la cour se paie : ce sont les frais d'immobilisation."]},{id:"putaway",chapter:2,title:"Le rangement",goal:"Rangez 10 palettes dans les racks. Affectez au moins un équipier au poste Rangement (onglet Centrale).",progress:e=>[e.stats.palletsPutaway,10],check:e=>e.stats.palletsPutaway>=10,reward:1e4,unlocks:["fil_FR","pick","load"],lesson:["Le rangement","Après contrôle, les palettes attendent au sol dans la zone de réception. Les caristes les rangent ensuite dans les racks, à une adresse précise : allée, colonne, niveau. Si la zone de réception déborde, toute la réception s'arrête : le rangement doit suivre le rythme des quais. C'est une règle d'or de l'entrepôt : le débit est celui du poste le plus lent."]},{id:"first_delivery",chapter:2,title:"Première commande filiale",goal:"La filiale France vous a passé commande. Dans Centrale › Préparation, lancez-la, puis laissez-la se charger et partir. Pensez à recruter des équipiers pour la préparation et le chargement.",progress:e=>[e.stats.ordersDelivered,1],check:e=>e.stats.ordersDelivered>=1,reward:15e3,unlocks:["techs","navette","dashboard","kaizen"],lesson:["Ce qu'est une filiale","Une filiale est la société de la maison dans un pays. Elle ne fabrique rien : elle achète les produits à la centrale, les garde dans son entrepôt local et les vend aux distributeurs de son pays (grands magasins, parfumeries, duty free). Pour éviter les ruptures, elle commande régulièrement : elle compare son stock, plus ce qui est déjà en route, à un stock cible exprimé en durée de couverture. Vous pouvez régler cette couverture dans l'onglet Filiales."]},{id:"otif5",chapter:3,title:"À l'heure et complet",goal:"Livrez 5 commandes OTIF : arrivées avant l'échéance ET complètes.",progress:e=>[e.stats.otif,5],check:e=>e.stats.otif>=5,reward:2e4,unlocks:["launch","buyers","marketing","dc_upgrades"],lesson:["L'OTIF, juge de paix",`L'OTIF (On Time In Full) mesure la part des commandes livrées à l'heure et complètes. C'est l'indicateur qui lie la centrale à ses filiales. Une commande partielle ou en retard crée des ruptures en point de vente, et en luxe une rupture se paie deux fois : la vente perdue et l'image de la marque. Ici, une filiale mal servie perd en satisfaction et ses ventes baissent. Nouveau : l'onglet Développement, pour créer ${B.PARF_100.name} puis toute une gamme.`]},{id:"ca",chapter:3,title:"Une maison qui décolle",goal:"Atteignez 150 000 € de chiffre d'affaires cumulé dans vos filiales.",progress:e=>[Math.floor(e.stats.revenue),15e4],check:e=>e.stats.revenue>=15e4,reward:25e3,unlocks:["fil_DE","fil_ES","fil_IT","sop","aps","contract","factory_SKINCARE"],lesson:["Le S&OP","Avec plus de volume vient le S&OP (Sales & Operations Planning) : chaque mois, ventes, marketing et supply chain alignent prévisions et capacités. Ici, une campagne marketing non anticipée vide les stocks des filiales avant que la centrale ait pu réagir. Le bon réflexe : augmenter la couverture des filiales et produire en avance avant le démarrage. Le module S&OP fait la même chose pour l'usine : il crée les OF à partir de la demande prévue et du stock de tout le réseau."]},{id:"skincare",chapter:4,title:"Deuxième catégorie",goal:"Construisez l'usine Skincare et livrez à une filiale une commande contenant un produit de soin.",progress:e=>[e.stats.skinDelivered,1],check:e=>e.stats.skinDelivered>=1,reward:3e4,unlocks:["fil_UK","fil_US","events"],lesson:["Chaque marché a son profil","Le soin domine en Asie, le parfum en travel retail, le maquillage aux États-Unis. Plus de références signifie des commandes multi-produits, plus de lignes à préparer, et des palettes « mixtes » à composer à la centrale. Attention aussi au monde réel : pannes du système informatique, vols de camions, grèves, pénuries et buzz arrivent désormais sans prévenir. Une bonne supply chain n'est pas celle qui n'a jamais de problème, c'est celle qui s'en remet vite."]},{id:"us",chapter:4,title:"Traverser l'Atlantique",goal:"Ouvrez la filiale États-Unis et livrez-lui une commande.",progress:e=>[e.filiales.US.delivered,1],check:e=>e.filiales.US.delivered>=1,reward:4e4,unlocks:["factory_MAKEUP","fil_AE"],lesson:["Bateau ou avion ?","Pour le grand export, on choisit entre le maritime (lent et bon marché : 4 à 6 semaines en réalité) et l'aérien (rapide mais 5 à 10 fois plus cher). Plus le délai est long, plus la filiale doit garder de couverture de stock, donc d'argent immobilisé. On utilise souvent le bateau pour le réassort courant et l'avion pour les lancements et les urgences."]},{id:"makeup",chapter:5,title:"Une maison complète",goal:"Construisez l'usine Maquillage.",progress:e=>[e.factories.MAKEUP.unlocked?1:0,1],check:e=>e.factories.MAKEUP.unlocked,reward:5e4,unlocks:["fil_CN","fil_BR"],lesson:["Le grand export","La Chine impose l'enregistrement des cosmétiques auprès des autorités avant toute vente, et le passage en douane allonge les délais. Le travel retail (aéroports, Dubaï) est un canal à part entière pour le luxe, très porté sur le parfum, avec ses propres règles de prix et d'approvisionnement."]},{id:"green",chapter:5,title:"Moins d'avion",goal:"À partir de maintenant, expédiez 80 palettes vers le grand export (États-Unis, Dubaï, Chine) avec moins de 25 % en avion. Passez au bateau et augmentez les couvertures.",progress:e=>[e.stats.greenSea+e.stats.greenAir,80],check:e=>e.stats.greenSea+e.stats.greenAir>=80&&e.stats.greenAir/(e.stats.greenSea+e.stats.greenAir)<.25,reward:6e4,unlocks:["factory_PRESTIGE","fil_KR","fil_JP","fil_SG","fil_ZA"],lesson:["Le fret aérien, premier poste carbone","Une palette en avion émet 30 à 50 fois plus de CO₂ qu'en bateau. Les grandes maisons de beauté se sont fixé des objectifs chiffrés de réduction du fret aérien, remplacé par le maritime et le transport intermodal. Pour y arriver, il faut des prévisions fiables et plus de couverture en filiale : l'avion ne doit servir qu'aux vraies urgences. Le remplissage des camions compte aussi : un camion à moitié vide émet autant qu'un camion plein. Nouveau : une usine de parfums d'exception, pour des extraits fabriqués en petites séries et vendus très cher, surtout en travel retail."]},{id:"world",chapter:5,title:"Supply chain mondiale",goal:"Avec au moins 4 filiales ouvertes, tenez un taux de service ≥ 95 % et un OTIF ≥ 90 % dans chacune pendant 10 minutes d'affilée.",progress:e=>[e.stats.excellence,600],check:e=>e.stats.excellence>=600,reward:1e5,unlocks:["fil_AU"],lesson:["Directeur Supply Chain Monde","Bravo : vous pilotez une chaîne complète, de la matière première au point de vente, sur plusieurs continents. Dans la vraie vie, le métier continue avec la prévision de la demande, la gestion des lancements, la durabilité (moins d'avion, des camions mieux remplis) et l'arbitrage permanent entre service, coût et stock. La partie continue : à vous d'optimiser !"]}],We=e=>B[e].cartonsPerPallet*B[e].unitsPerCarton,Dx=(e,t)=>{let n=B[e],r=We(e),i=t%r;return{pallets:Math.floor(t/r),cartons:Math.floor(i/n.unitsPerCarton),units:i%n.unitsPerCarton}},O3=e=>{let t=B[e];return{...t.comps,[te[t.factory].carton]:1/t.unitsPerCarton,PALETTE:1/We(e)}},Ux=e=>Object.entries(te[e].raw).reduce((t,[n,r])=>t+ct[n].cost*r,0),m3=e=>Ux(B[e].factory)+Object.entries(O3(e)).reduce((t,[n,r])=>t+ct[n].cost*r,0),I3=(e,t,n)=>{let r=te[e],i={},o=(u,c)=>{i[u]=(i[u]||0)+c},l=n?r.skus.filter(u=>n.launched[u]):[],s=l.length?l:r.skus;return Object.entries(r.raw).forEach(([u,c])=>o(u,c*t)),s.forEach(u=>Object.entries(O3(u)).forEach(([c,d])=>o(c,d*t/s.length))),Object.keys(i).forEach(u=>{i[u]=Math.ceil(i[u])}),i},Dm=e=>Object.entries(e).reduce((t,[n,r])=>t+ct[n].cost*r,0),il=e=>Qt.filter(t=>e.factories[B[t].factory].unlocked&&e.launched[t]),Jo=e=>{let t=B[e],n=A3[e];return`${t.name} · pesée ${n.weigh} u/min · cuve : lots de ${n.batch} u en ${n.cuve} min .lx h2, .lx h3, .lx h4 { font-family: Didot, "Bodoni MT", "Playfair Display", Georgia, serif; font-weight: 500; }
.lx h4 { font-size: 0.82em; letter-spacing: 0.14em; text-transform: uppercase; }
.lx button { font-family: inherit; cursor: pointer; border-radius: 6px; }
.lx select, .lx input, .lx textarea { border-radius: 6px; }
.lx button { transition: transform 0.12s ease, filter 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease; }
.lx button:not(:disabled):active { transform: translateY(1px) scale(0.98); }
.lx .card { transition: box-shadow 0.25s ease, transform 0.25s ease; }
.lx .card:hover { box-shadow: inset 0 2px 0 #c9a24b, 0 2px 4px rgba(17,17,17,0.05), 0 10px 26px rgba(17,17,17,0.07) !important; }
.lx .hint { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: help; transition: background-color 0.2s ease; }
.lx .hint:hover, .lx .hint.open { white-space: normal; overflow: visible; background-color: #f6f1e4 !important; }
@keyframes lxfade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes lxtoast { from { opacity: 0; transform: translate(-50%, 14px); } to { opacity: 1; transform: translate(-50%, 0); } }
.lx .tabfade { animation: lxfade 0.35s ease both; }
.lx .toast { animation: lxtoast 0.35s cubic-bezier(.2,.8,.2,1) both; }
@media (prefers-reduced-motion: reduce) { .lx *, .lx *::before, .lx *::after { animation: none !important; transition: none !important; } }
.lx button:not(:disabled):hover { filter: brightness(1.12); }
.lx button:disabled { cursor: not-allowed; }
.lx .g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.lx .g3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
@keyframes lxpulse { 0%,100% { box-shadow: 0 0 0 0 rgba(201,162,75,0.0); } 50% { box-shadow: 0 0 0 4px rgba(201,162,75,0.45); } }
.lx .pulse { animation: lxpulse 1.6s ease-in-out infinite; }
.lx { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; box-sizing: border-box; }
.lx *, .lx *::before, .lx *::after { box-sizing: inherit; }
.lx img, .lx canvas, .lx table { max-width: 100%; }
.lx .tabbar::-webkit-scrollbar, .lx .chips::-webkit-scrollbar { display: none; }
@media (max-width: 720px), (max-height: 500px) {
  .lx { padding: 0 8px calc(74px + env(safe-area-inset-bottom)) 8px !important; }
  .lx main { padding: 10px !important; min-height: 0 !important; }
  .lx .card { padding: 12px !important; }
  .lx .g2:not(.keep) { grid-template-columns: minmax(0, 1fr) !important; gap: 10px; }
  .lx .g3 { gap: 10px; }
  .lx .chips { flex-wrap: nowrap !important; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin-left: -10px !important; margin-right: -10px !important; padding: 0 10px 2px 10px; }
  .lx .chips > button { flex: 0 0 auto; white-space: nowrap; }
  .lx select, .lx input { font-size: 16px !important; }
  .lx h3 { font-size: 1.1em; }
}
@media (pointer: coarse) {
  .lx button { min-height: 34px; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
  .lx button.step { width: 34px !important; height: 34px !important; min-height: 34px; }
  .lx button:not(:disabled):hover { filter: none; }
}
